# Lampy single-image process supervisor.
# PID 1 is supervisord; every stack service is a program below.
# Secrets come from the container environment at run time:
#   POSTGRES_PASSWORD  (postgres + pgai-worker)
#   PASSWORD           (code-server)

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisor/supervisord.pid
childlogdir=/var/log/supervisor

[program:postgres]
command=/docker-entrypoint.sh postgres
user=postgres
environment=PGDATA="/home/postgres/pgdata/data"
autorestart=true
startsecs=10
stdout_logfile=/var/log/supervisor/postgres.log
stderr_logfile=/var/log/supervisor/postgres_err.log

[program:apache2]
command=/usr/sbin/apache2ctl -D FOREGROUND
autorestart=true
stdout_logfile=/var/log/supervisor/apache2.log
stderr_logfile=/var/log/supervisor/apache2_err.log

[program:ollama]
command=/usr/bin/ollama serve
environment=OLLAMA_HOST="0.0.0.0:11434"
autorestart=true
stdout_logfile=/var/log/supervisor/ollama.log
stderr_logfile=/var/log/supervisor/ollama_err.log

[program:james]
command=/usr/bin/java -Dworking.directory=/opt/james/james-server-jpa-guice -jar james-server-jpa-app.jar
directory=/opt/james/james-server-jpa-guice
autorestart=true
startsecs=20
stdout_logfile=/var/log/supervisor/james.log
stderr_logfile=/var/log/supervisor/james_err.log

[program:codeserver]
command=/usr/local/bin/codeserver-start.sh
autorestart=true
stdout_logfile=/var/log/supervisor/codeserver.log
stderr_logfile=/var/log/supervisor/codeserver_err.log

[program:pgai-worker]
command=/usr/local/bin/pgai-worker.sh
autorestart=true
stdout_logfile=/var/log/supervisor/pgai-worker.log
stderr_logfile=/var/log/supervisor/pgai-worker_err.log
