<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lampy C IDE</title>
<style>
  body { font-family: monospace; margin: 1em; background: #1e1e1e; color: #d4d4d4; }
  #bar { margin-bottom: 0.5em; }
  #bar input { font-family: monospace; background: #2d2d2d; color: #d4d4d4; border: 1px solid #555; padding: 2px 6px; }
  #src { width: 100%; height: 40vh; background: #252526; color: #d4d4d4; border: 1px solid #555; font-family: monospace; font-size: 14px; }
  #out { white-space: pre-wrap; background: #111; border: 1px solid #555; padding: 0.5em; min-height: 20vh; }
  button { font-family: monospace; padding: 4px 12px; margin-right: 6px; cursor: pointer; }
  .err { color: #f48771; } .ok { color: #7ee787; }
</style>
</head>
<body>
<h2>Lampy C IDE <span style="font-size:12px;color:#888">(gcc <span id="gccver">…</span>)</span></h2>
<div id="bar">
  <button onclick="run()">Compile &amp; Run</button>
  <button onclick="save()">Save</button>
  <button onclick="loadSel()">Load</button>
  <select id="files"></select>
  file: <input id="name" size="12" value="prog">
  flags: <input id="flags" size="24" value="-Wall -Wextra -O2">
  stdin: <input id="stdin" size="20" placeholder="(program input)">
</div>
<textarea id="src" spellcheck="false">#include &lt;stdio.h&gt;
int main(void) {
    printf("CC_WORKS\n");
    return 0;
}
</textarea>
<h3>Output</h3>
<div id="out">(press Compile &amp; Run)</div>
<script>
async function api(path, opts) {
  const r = await fetch(path, opts);
  return r.json();
}
async function run() {
  const out = document.getElementById('out');
  out.textContent = 'compiling…';
  const res = await api('/api/compile', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      name: document.getElementById('name').value,
      source: document.getElementById('src').value,
      flags: document.getElementById('flags').value,
      stdin: document.getElementById('stdin').value
    })
  });
  let t = '';
  if (!res.ok) {
    t += '✗ ' + (res.stage || 'error') + '\n' + (res.error || '');
  } else {
    t += '✓ compiled, exit ' + res.exit_code + '\n';
  }
  for (const k of ['compile_stderr', 'stderr', 'stdout'])
    if (res[k]) t += '\n--- ' + k + ' ---\n' + res[k];
  out.textContent = t;
}
async function save() {
  const name = document.getElementById('name').value;
  const res = await api('/api/files/' + encodeURIComponent(name), {
    method: 'PUT', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({source: document.getElementById('src').value})
  });
  document.getElementById('out').textContent = res.ok ? 'saved ' + name : 'save failed: ' + res.error;
  refreshFiles();
}
async function loadSel() {
  const sel = document.getElementById('files');
  if (!sel.value) return;
  const res = await api('/api/files/' + encodeURIComponent(sel.value));
  if (res.ok) {
    document.getElementById('name').value = res.name;
    document.getElementById('src').value = res.source;
  }
}
async function refreshFiles() {
  const res = await api('/api/files');
  const sel = document.getElementById('files');
  sel.innerHTML = res.files.map(f => '<option>' + f + '</option>').join('');
}
refreshFiles();
</script>
</body>
</html>
