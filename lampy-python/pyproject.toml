[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lampy"
version = "0.1.0"
description = "Python utilities for the Lampy forum stack (health checks, config generation, Ollama client, James admin)"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lampy*"]
