# DRAFT 2026-09-19 — environmental configuration for the pgrx build side.
#
# Transcribed from Kit's 2025-02-23 sketch ENV block, corrected against
# ~/workspace/forum-stack/env.sh and the 2026-09-19 reference-host findings.
# $ROOT = project root on the target machine (C:\Lampy on Windows per the
# doc; the workspace path on the Linux reference host).
#
# Corrections vs the sketch:
#   - HTTPS_PROXY=8.8.8.8 REMOVED (that is a DNS address, not a proxy).
#   - PGDATA no longer uses Windows backslash escapes; per-platform below.
#   - POSTGRES_PASSWORD is NEVER stored in a file (deploy-time only).
#   - PGRX_BUILD_FLAGS=TRUE kept as Windows-only (see below).
#   - CARGO_TARGET_DIR points at persistent disk, not /tmp (tmpfs risk).

STATUS = "draft 2026-09-19"

# --- project layout ---
PROJECT_ROOT = "$ROOT"
PGRX_HOME    = "$ROOT/.pgrx"
PGLOCALEDIR  = "$ROOT"

# --- Rust toolchain ---
CARGO_HOME       = "$HOME/.cargo"
RUSTUP_HOME      = "$HOME/.rustup"
CARGO_TARGET_DIR = "$ROOT/build/cargo-target"
PATH_PREPEND     = "$CARGO_HOME/bin"

# --- pgrx behavior ---
PGRX_BUILD_VERBOSE      = "TRUE"
PGRX_IGNORE_RUST_VERSIONS = "1"
# PGRX_BUILD_FLAGS=TRUE is Kit's tested Windows setting (in the sketch).
# cargo-pgrx 0.19.2 on Linux passes the value verbatim as rustc args, so
# "TRUE" breaks every build there ("multiple input filenames provided").
# Set ONLY on Windows/WSL2 after re-verifying against its pgrx version;
# leave UNSET on cargo-pgrx 0.19.x Linux hosts.
PGRX_BUILD_FLAGS = "UNSET on cargo-pgrx 0.19.x Linux; TRUE on Windows pending re-verification"

# --- PostgreSQL ---
# Windows/prod:  $ROOT/postgres/data   (doc layout)
# Reference host: /var/lib/postgresql/16/main (Debian apt cluster)
PGDATA        = "$ROOT/postgres/data"
POSTGRES_USER = "postgres"
# POSTGRES_PASSWORD: supplied at deploy time, never stored in this file.
