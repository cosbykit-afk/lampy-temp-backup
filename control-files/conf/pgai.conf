# DRAFT 2026-09-19 — environmental configuration for the pgai side.
#
# pgai is the extension that gives AI access to the vectorized database.
# Values from Kit's 2025-02-23 sketch ENV block and the runbook's pgai
# procedure (CREATE EXTENSION ai CASCADE + ai.create_vectorizer with the
# Ollama embedder). Passwords are NEVER stored in a file (deploy-time only).

STATUS = "draft 2026-09-19"

# --- Ollama (embedding provider; Kit's choice) ---
# Windows/doc:  C:\ollama\models
# Reference host: $HOME/.ollama/models
OLLAMA_MODELS = "$ROOT/ollama/models"
OLLAMA_HOST   = "http://127.0.0.1:11434"

# --- vectorizer (pinned at bring-up against the installed pgai release) ---
PGAI_EMBEDDING_MODEL     = "nomic-embed-text"
PGAI_EMBEDDING_DIMENSION = "768"

# --- database the vectorizer worker talks to ---
# Reference host (everything local):
FORUM_DB_HOST = "127.0.0.1"
FORUM_DB_PORT = "5432"
FORUM_DB_NAME = "forum"
FORUM_DB_USER = "forum"
# FORUM_DB_PASS: supplied at deploy time, never stored in this file.
# Prod topology: database runs in Docker on Windows; the worker and Ollama
# run in WSL2 — FORUM_DB_HOST becomes the Windows host address there.
